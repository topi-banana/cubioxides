[workspace]
resolver = "3"
members = ["core", "ffi-tests", "fixtures-gen"]
default-members = ["core"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
version = "0.0.0"
license = "MIT"
repository = "https://github.com/topi-banana/cubioxides"
authors = ["topi <topi87.oke@gmail.com>"]

[workspace.dependencies]
bindgen = "0.72"
bitflags = "2.6"
bytemuck = { version = "1.21", features = ["derive"] }
cc = "1.2"
libm = "0.2"
pretty_assertions = "1.4"
proptest = "1.5"
rayon = "1.10"
rstest = "0.26"
thiserror = "2.0"

[workspace.lints.rust]
# Default to deny; the cubioxides-core crate enforces forbid via an attribute
# in lib.rs. FFI-only members (fixtures-gen, ffi-tests) downgrade this to
# allow because they must call into the cubiomes C library.
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
# u64::from(x: u32) is the idiomatic replacement, but it isn't a const fn
# yet, and many of our integer casts live inside const-fn LCG / Xoroshiro
# helpers. Plain `as` casts stay.
cast_lossless = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
similar_names = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
